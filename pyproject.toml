[project]
name = "taimen-process-runtime"
version = "0.1.0"
description = "BPMN/DMN process runtime of the Taimen platform: SpiffWorkflow behind a resource-service API (superproject ADR-0023/0032)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "opentelemetry-api>=1.25",
    "platform-auth-sdk",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    # LGPL-3.0; used as an unmodified library, fixes go upstream (PC-ADR-023 history).
    "spiffworkflow>=3.1.2,<4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_runtime"]

[tool.uv]
package = true

[tool.uv.sources]
# Общий enforcement SDK — соседний репозиторий суперпроекта (ADR-0029/0030):
# контекст docker build поэтому — корень суперпроекта, не каталог сервиса.
platform-auth-sdk = { path = "../platform-auth-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: тесты на реальной PostgreSQL (PR_TEST_DATABASE_URL); без неё пропускаются",
    "security: sandbox script-task",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# B008: FastAPI Depends в значениях по умолчанию.
# RUF001-003: пояснения пишутся по-русски, кириллица в них не является ошибкой.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
